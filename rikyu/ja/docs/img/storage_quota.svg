<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 490" width="700" height="490" role="img" aria-label="理究ポータルのグループ領域の容量変更画面">
  <style>
    .bg     { fill: #ffffff; }
    .body   { fill: #faf9f7; }
    .card   { fill: #ffffff; stroke: #dcd8d1; }
    .line   { stroke: #e5e2dc; }
    .field  { fill: #ffffff; stroke: #b9b4ab; }
    .accent { fill: #7a5c33; }
    .title  { fill: #1f1d1a; }
    .text   { fill: #3d3a35; }
    .muted  { fill: #6f6a62; }
    .onacc  { fill: #ffffff; }
    .track  { fill: #e9e6e0; }
    .fill   { fill: #7a5c33; }
    .info   { fill: #eef3fa; stroke: #d3ddec; }
    .infotx { fill: #3d3a35; }
    .infoic { fill: #5a7ca8; }
    text { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }

    @media (prefers-color-scheme: dark) {
      .bg     { fill: #24262c; }
      .body   { fill: #1c1e23; }
      .card   { fill: #24262c; stroke: #454952; }
      .line   { stroke: #454952; }
      .field  { fill: #24262c; stroke: #5c616c; }
      .accent { fill: #b99a67; }
      .title  { fill: #f2f1ee; }
      .text   { fill: #d7d5d0; }
      .muted  { fill: #9d9a94; }
      .onacc  { fill: #1c1e23; }
      .track  { fill: #3a3d45; }
      .fill   { fill: #b99a67; }
      .info   { fill: #232c3a; stroke: #3c4a5e; }
      .infotx { fill: #d7d5d0; }
      .infoic { fill: #8fb0d8; }
    }
  </style>

  <rect class="body" x="0" y="0" width="700" height="490"/>

  <!-- header -->
  <rect class="bg" x="0" y="0" width="700" height="56"/>
  <line class="line" x1="0" y1="56" x2="700" y2="56"/>
  <rect class="accent" x="20" y="16" width="24" height="24" rx="6"/>
  <text class="onacc" x="32" y="32.5" font-size="10" text-anchor="middle" dominant-baseline="middle">理究</text>
  <text class="title" x="54" y="33" font-size="15" font-weight="600" dominant-baseline="middle">理究 ポータル</text>

  <text class="muted" x="480" y="33" font-size="13" text-anchor="middle" dominant-baseline="middle">ホーム</text>
  <text class="title" x="535" y="33" font-size="13" text-anchor="middle" dominant-baseline="middle">利用量</text>
  <rect class="accent" x="512" y="45" width="46" height="2"/>
  <text class="muted" x="585" y="33" font-size="13" text-anchor="middle" dominant-baseline="middle">請求</text>
  <text class="muted" x="645" y="33" font-size="13" text-anchor="middle" dominant-baseline="middle">API キー</text>

  <!-- storage section -->
  <text class="title" x="40" y="86" font-size="16" font-weight="600" dominant-baseline="middle">ストレージ</text>

  <rect class="card" x="40" y="102" width="620" height="92" rx="10"/>
  <text class="title" x="66" y="126" font-size="13" font-weight="600" dominant-baseline="middle">課題共有 — rkpXXXXX</text>

  <text class="text" x="66" y="148" font-size="12" font-weight="600" dominant-baseline="middle">data1</text>
  <text class="accent" x="106" y="148" font-size="12" dominant-baseline="middle">容量を変更</text>

  <text class="muted" x="66" y="168" font-size="11" dominant-baseline="middle">容量</text>
  <rect class="track" x="126" y="165" width="392" height="6" rx="3"/>
  <rect class="fill"  x="126" y="165" width="8"   height="6" rx="3"/>
  <text class="muted" x="634" y="168" font-size="11" text-anchor="end" dominant-baseline="middle">4 KB / 10 TB (0%)</text>

  <text class="muted" x="66" y="186" font-size="11" dominant-baseline="middle">ファイル数</text>
  <rect class="track" x="126" y="183" width="392" height="6" rx="3"/>
  <rect class="fill"  x="126" y="183" width="8"   height="6" rx="3"/>
  <text class="muted" x="634" y="186" font-size="11" text-anchor="end" dominant-baseline="middle">1 / 10.0M (0%)</text>

  <!-- dialog -->
  <rect class="card" x="120" y="216" width="460" height="250" rx="10"/>
  <text class="title" x="142" y="248" font-size="16" font-weight="600" dominant-baseline="middle">data1 容量の変更</text>
  <text class="muted" x="142" y="274" font-size="12" dominant-baseline="middle">rkpXXXXX — data1</text>
  <text class="text"  x="142" y="296" font-size="12" dominant-baseline="middle">現在の利用量: 4 KB / 10 TB</text>

  <rect class="field" x="142" y="312" width="416" height="38" rx="5"/>
  <rect class="card"  x="152" y="307" width="86" height="10" stroke="none"/>
  <text class="muted" x="156" y="312.5" font-size="9" dominant-baseline="middle">新しい容量 (TB)</text>
  <text class="text"  x="158" y="332" font-size="14" dominant-baseline="middle">20</text>
  <text class="muted" x="146" y="364" font-size="10" dominant-baseline="middle">1〜100 TB(1 TB 単位)</text>

  <rect class="info" x="142" y="376" width="416" height="46" rx="6"/>
  <circle class="infoic" cx="162" cy="399" r="7"/>
  <text class="onacc" x="162" y="399.5" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="middle">i</text>
  <text class="infotx" x="178" y="393" font-size="11" dominant-baseline="middle">減量は翌月 1 日に適用されます(当月の課金は現在の</text>
  <text class="infotx" x="178" y="408" font-size="11" dominant-baseline="middle">容量が基準です)。</text>

  <text class="muted" x="452" y="443" font-size="13" text-anchor="middle" dominant-baseline="middle">キャンセル</text>
  <rect class="accent" x="492" y="428" width="66" height="30" rx="5"/>
  <text class="onacc" x="525" y="443" font-size="13" text-anchor="middle" dominant-baseline="middle">変更する</text>
</svg>
