[project]
site_name = "RIKYU User Guide"
site_author = "RIKEN Center for Computational Science"
site_url = "https://docs.r-ccs.riken.jp/rikyu/ja/"
site_dir = "site"
docs_dir = "docs"
copyright = """
Copyright &copy; RIKEN Center for Computational Science
"""

nav = [
  { "はじめに" = "index.md" },
  { "システム概要" = "system.md" },
  { "ストレージ" = "storage.md" },
  { "ログイン方法" = "login.md" },
  { "モジュール環境" = "module.md" },
  { "プログラムのコンパイル方法" = "compile.md" },
  { "コンテナの使い方" = "container.md" },
  { "ジョブ実行資源" = "resources.md" },
  { "Open OnDemandの使い方" = "ood.md" },
  { "Open Composerの使い方" = "composer.md" },
  { "Slurmの使い方" = "slurm.md" },
  { "Spackの使い方" = "spack.md" },
  { "S3ファイルシステムの使い方" = "s3.md" },
  { "生成AIサービス" = "genai.md" },
  { "システムアップデート履歴" = "changelog.md" },
  { "規約・関連文書" = [
    { "「理究」利用規則" = "rules/regulations.md" },
    { "アカウント申請システム（RAAS）利用規約" = "rules/raas-terms.md" },
    { "利用者の個人に関するデータの取扱について" = "rules/personal-data.md" },
    { "共有研究資産の取扱について" = "rules/shared-research-assets.md" },
    { "研究設備の利用料の取扱いについて" = "rules/fees.md" },
    { "「理究」利用料の請求について" = "rules/billing.md" },
    { "誓約書（利用者向け）" = "rules/pledge-users.md" },
    { "誓約書（有償利用）" = "rules/pledge-fee-based.md" },
    { "データ等の取扱について" = "rules/user-data.md" },
    { "サービスレベルアグリーメント・目標" = "rules/sla.md" },
    { "セキュリティホワイトペーパー" = "rules/security-whitepaper.md" },
  ] },
  { "お問い合わせ" = "contact.md" },
]

extra_css = ["extra.css"]

[project.theme]
language = "ja"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "toc.integrate",
]

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "ダークモードに切り替え"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "ライトモードに切り替え"
