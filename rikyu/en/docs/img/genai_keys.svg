<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="700" height="260" role="img" aria-label="API key creation form in the RIKYU Portal">
  <style>
    .bg     { fill: #ffffff; }
    .body   { fill: #faf9f7; }
    .card   { fill: #ffffff; stroke: #dcd8d1; }
    .line   { stroke: #e5e2dc; }
    .field  { fill: #ffffff; stroke: #b9b4ab; }
    .accent { fill: #7a5c33; }
    .title  { fill: #1f1d1a; }
    .text   { fill: #3d3a35; }
    .muted  { fill: #6f6a62; }
    .onacc  { fill: #ffffff; }
    .caret  { fill: #6f6a62; }
    text { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }

    @media (prefers-color-scheme: dark) {
      .bg     { fill: #24262c; }
      .body   { fill: #1c1e23; }
      .card   { fill: #24262c; stroke: #454952; }
      .line   { stroke: #454952; }
      .field  { fill: #24262c; stroke: #5c616c; }
      .accent { fill: #b99a67; }
      .title  { fill: #f2f1ee; }
      .text   { fill: #d7d5d0; }
      .muted  { fill: #9d9a94; }
      .onacc  { fill: #1c1e23; }
      .caret  { fill: #9d9a94; }
    }
  </style>

  <rect class="body" x="0" y="0" width="700" height="260"/>

  <!-- header -->
  <rect class="bg" x="0" y="0" width="700" height="56"/>
  <line class="line" x1="0" y1="56" x2="700" y2="56"/>
  <rect class="accent" x="20" y="16" width="24" height="24" rx="6"/>
  <text class="onacc" x="32" y="32.5" font-size="10" text-anchor="middle" dominant-baseline="middle">理究</text>
  <text class="title" x="54" y="33" font-size="15" font-weight="600" dominant-baseline="middle">RIKYU Portal</text>

  <text class="muted" x="470" y="33" font-size="13" text-anchor="middle" dominant-baseline="middle">Home</text>
  <text class="muted" x="520" y="33" font-size="13" text-anchor="middle" dominant-baseline="middle">Usage</text>
  <text class="muted" x="575" y="33" font-size="13" text-anchor="middle" dominant-baseline="middle">Billing</text>
  <text class="title" x="640" y="33" font-size="13" text-anchor="middle" dominant-baseline="middle">API Keys</text>
  <rect class="accent" x="609" y="45" width="62" height="2"/>

  <!-- create form card -->
  <rect class="card" x="40" y="100" width="620" height="120" rx="10"/>
  <text class="text" x="66" y="132" font-size="13" dominant-baseline="middle">Create a new key</text>

  <rect class="field" x="66" y="150" width="200" height="42" rx="5"/>
  <rect class="card" x="76" y="145" width="60" height="10" stroke="none"/>
  <text class="muted" x="80" y="150.5" font-size="9" dominant-baseline="middle">Project ID</text>
  <text class="text" x="82" y="172" font-size="14" dominant-baseline="middle">rkpXXXXX</text>
  <path class="caret" d="M238 168 l6 8 l6 -8 z"/>

  <rect class="accent" x="284" y="155" width="82" height="32" rx="5"/>
  <text class="onacc" x="325" y="172" font-size="12" font-weight="600" letter-spacing="0.6" text-anchor="middle" dominant-baseline="middle">CREATE</text>
</svg>
