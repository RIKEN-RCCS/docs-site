[project]
site_name = "RIKYU User Guide"
site_author = "RIKEN Center for Computational Science"
site_url = "https://docs.r-ccs.riken.jp/rikyu/en/"
site_dir = "site"
docs_dir = "docs"
copyright = """
Copyright &copy; RIKEN Center for Computational Science
"""

nav = [
  { "Welcome" = "index.md" },
  { "System Overview" = "system.md" },
  { "Storage" = "storage.md" },
  { "Login" = "login.md" },
  { "Module Environment" = "module.md" },
  { "Compiling Programs" = "compile.md" },
  { "Containers" = "container.md" },
  { "Job Resources" = "resources.md" },
  { "Open OnDemand" = "ood.md" },
  { "Open Composer" = "composer.md" },
  { "Slurm" = "slurm.md" },
  { "Spack" = "spack.md" },
  { "S3 File System" = "s3.md" },
  { "Generative AI Service" = "genai.md" },
  { "System Update History" = "changelog.md" },
  { "Regulations and Related Documents" = [
    { "Regulations for Use of RIKYU" = "rules/regulations.md" },
    { "RAAS Terms of Service" = "rules/raas-terms.md" },
    { "Handling of Personal Data" = "rules/personal-data.md" },
    { "Handling of Shared Research Assets" = "rules/shared-research-assets.md" },
    { "Handling of Usage Fees" = "rules/fees.md" },
    { "Billing of Usage Fees" = "rules/billing.md" },
    { "Pledge (For RIKYU Users)" = "rules/pledge-users.md" },
    { "Pledge (For Fee-based Access)" = "rules/pledge-fee-based.md" },
    { "Guidelines for Users' Data" = "rules/user-data.md" },
    { "Service Level Agreement/Objectives" = "rules/sla.md" },
    { "Security White Paper" = "rules/security-whitepaper.md" },
  ] },
  { "Contact" = "contact.md" },
]

extra_css = ["extra.css"]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "toc.integrate",
]

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
